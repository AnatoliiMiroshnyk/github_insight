[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "github-insight"
version = "1.0.0"
description = "Portfolio-ready GitHub profile analytics web service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Anatolii Miroshnyk"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0", "pytest-cov>=5,<7", "ruff>=0.6,<1.0"]

[project.scripts]
github-insight = "github_insight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/github_insight"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

